<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1e2f36">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Revista Leire">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>La estantería de Hugo</title>
<style>
:root{--stage:#e4e8e2;--paper:#f7f4ed;--ink:#1e2a33;--mut:#6c7479;--acc:#2f6b66;--soft:#e8eeea;--line:#d5d9d2;--dark:#1e2f36;--plank:#cdbfa8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--stage:#12181b;--paper:#222b2f;--ink:#eceee8;--mut:#a3adb1;--acc:#7fb8b0;--soft:#2c373b;--line:#3a464a;--dark:#0f1a1e;--plank:#4a4138;color-scheme:dark}}
:root[data-theme="dark"]{--stage:#12181b;--paper:#222b2f;--ink:#eceee8;--mut:#a3adb1;--acc:#7fb8b0;--soft:#2c373b;--line:#3a464a;--dark:#0f1a1e;--plank:#4a4138;color-scheme:dark}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100%;background:var(--stage);color:var(--ink);font:16px/1.6 Georgia,"Times New Roman",serif}
.stage{flex:1;min-height:0;width:100%;position:relative;overflow:hidden}
.book{position:absolute;top:12px;bottom:4px;left:0;right:0;margin:0 auto;width:min(calc(100% - 20px),520px);max-height:760px}
.leaf{position:absolute;inset:0;transition:transform .55s ease,visibility 0s;border-radius:4px 10px 10px 4px}
.leaf.far{visibility:hidden}.leaf.flipped{transform:translateX(-108%);visibility:hidden;transition:transform .55s ease,visibility 0s .55s}
.pg{position:absolute;inset:0;border-radius:4px 10px 10px 4px}
.pg>*{flex-shrink:0}.pg{background:var(--paper);overflow-y:auto;padding:30px 28px 16px;display:flex;flex-direction:column;box-shadow:0 10px 30px rgba(0,0,0,.18);border-left:3px solid var(--line);scrollbar-width:thin;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
button{touch-action:manipulation}
.num{margin-top:auto;padding-top:22px;text-align:center;font:600 11px Helvetica,Arial,sans-serif;color:var(--mut);pointer-events:none}
h1,h2,h3,.sans{font-family:Helvetica,Arial,sans-serif}
.k{font:700 11px/1 Helvetica,Arial,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--acc);margin:0 0 8px}
h2{font:700 25px/1.15 Georgia,serif;margin:0 0 6px}
.sub{font-style:italic;color:var(--mut);margin:0 0 14px}
h3{font:700 12px/1.3 Helvetica,Arial,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:var(--acc);margin:18px 0 6px}
p{margin:0 0 12px}
.box{background:var(--soft);border-radius:10px;padding:12px 14px;margin:0 0 10px;font-size:15px;line-height:1.5}
.box b{font:700 12px Helvetica,Arial,sans-serif;color:var(--acc);display:block;margin-bottom:2px;text-transform:uppercase;letter-spacing:.06em}
.ad{border:1px solid var(--acc);border-radius:10px;padding:12px 14px;text-align:center;margin:18px 0 0}
.ad .k{text-align:center}.ad strong{display:block;font:700 16px Helvetica,Arial,sans-serif;margin-bottom:4px}
.ad small,.small{color:var(--mut);font:12px/1.4 Helvetica,Arial,sans-serif}
blockquote{margin:12px 0;padding:2px 0 2px 14px;border-left:3px solid var(--acc);font-style:italic}
blockquote span{display:block;font:12px Helvetica,Arial,sans-serif;color:var(--mut);font-style:normal;margin-top:2px}
.q{font:700 14px Helvetica,Arial,sans-serif;margin:12px 0 2px}
.ill{display:block;margin:6px auto 14px;max-width:100%;color:var(--acc)}
.cover{background:var(--dark);color:#fff;padding:34px 30px;display:flex;flex-direction:column;border-left-color:#0b1316}
.cover .top{display:flex;justify-content:space-between;font:700 10px Helvetica,Arial,sans-serif;letter-spacing:.14em;color:#9cc5be;border-bottom:1px solid #7fb3ab;padding-bottom:10px}
.cover h1{font:700 clamp(52px,15vw,82px)/.95 Georgia,serif;margin:auto 0 12px;letter-spacing:-.02em}
.cover em{color:#c9dbd7;font-size:18px}
.cover ul{list-style:none;padding:0;margin:26px 0 0;font-size:14px;color:#e8efed}
.cover ul li{padding:3px 0}.cover .lab{font:700 10px Helvetica,Arial,sans-serif;letter-spacing:.14em;color:#9cc5be;margin-top:22px}
.cover svg{color:#9cc5be;align-self:flex-end;margin-top:12px}
.ctrl{display:flex;align-items:center;gap:14px;padding:8px 0 calc(12px + env(safe-area-inset-bottom,0px));font:600 13px Helvetica,Arial,sans-serif;color:var(--mut)}
.ctrl button{background:var(--acc);color:var(--paper);border:0;border-radius:99px;width:40px;height:40px;font-size:18px;cursor:pointer}
.ctrl button:disabled{opacity:.3;cursor:default}
.hint{font:11px Helvetica,Arial,sans-serif;color:var(--mut);padding-bottom:4px}

.wrap{max-width:900px;margin:0 auto;padding:44px 20px 70px}
.wrap h1{font:700 34px/1.1 Georgia,serif;margin:0 0 6px}.wrap .lead{color:var(--mut);font-style:italic;margin:0 0 40px}
.row{display:flex;gap:22px;align-items:flex-end;padding:0 18px;min-height:196px}
.plank{height:16px;background:var(--plank);border-radius:2px;box-shadow:0 9px 14px rgba(0,0,0,.18);margin-bottom:44px}
.mag{width:132px;height:184px;border:0;border-radius:3px 8px 8px 3px;cursor:pointer;color:#fff;text-align:left;padding:14px 12px;display:flex;flex-direction:column;justify-content:space-between;box-shadow:inset 6px 0 0 rgba(0,0,0,.28),4px 7px 12px rgba(0,0,0,.28);transition:transform .25s;font-family:Georgia,serif}
.mag:hover,.mag:focus-visible{transform:translateY(-9px) rotate(-1.5deg);outline:none}
.mag .n{font:700 10px Helvetica,Arial,sans-serif;letter-spacing:.12em;opacity:.8;text-transform:uppercase}
.mag .t{font-size:25px;line-height:1;font-weight:700}.mag .d{font:11px Helvetica,Arial,sans-serif;opacity:.8;text-transform:capitalize}
.mag.empty{background:transparent;border:2px dashed var(--line);box-shadow:none;color:var(--mut);cursor:default;align-items:center;justify-content:center;text-align:center;font:italic 14px Georgia,serif}
.mag.empty:hover{transform:none}
.reader{position:fixed;top:0;left:0;right:0;height:100vh;height:100dvh;background:var(--stage);display:none;flex-direction:column;align-items:center;z-index:50;padding-top:env(safe-area-inset-top,0px)}
.reader.on{display:flex}
.bar{width:100%;max-width:560px;padding:10px 14px 0}
.bar button{background:none;border:0;color:var(--acc);font:700 14px Helvetica,Arial,sans-serif;cursor:pointer;padding:6px 0}
.soup{display:grid;grid-template-columns:repeat(10,1fr);max-width:340px;margin:8px auto 12px;gap:2px}
.sc{aspect-ratio:1;border:0;background:var(--soft);color:var(--ink);font:700 15px Helvetica,Arial,sans-serif;border-radius:4px;padding:0;cursor:pointer}
.sc.on{background:var(--acc);color:var(--paper)}.sc.sol{outline:2px solid var(--acc);outline-offset:-2px}
.words{display:flex;flex-wrap:wrap;gap:4px 10px;justify-content:center;font:700 11px Helvetica,Arial,sans-serif;letter-spacing:.06em;color:var(--mut);margin-bottom:14px}
.xw{display:grid;grid-template-columns:repeat(11,1fr);max-width:352px;margin:8px auto 14px;gap:2px}
.cx{position:relative;aspect-ratio:1}
.cx input{width:100%;height:100%;border:1px solid var(--line);background:var(--paper);color:var(--ink);text-align:center;font:700 16px Helvetica,Arial,sans-serif;text-transform:uppercase;padding:0;border-radius:3px;outline:0}
.cx input:focus{border-color:var(--acc);background:var(--soft)}
.cx input.ok{background:#cfe6d3;color:#1e2a33}.cx input.bad{background:#f3d1c8;color:#1e2a33}
.cx i{position:absolute;top:1px;left:2px;font:700 8px Helvetica,Arial,sans-serif;color:var(--acc);font-style:normal;pointer-events:none}
.pz{background:var(--acc);color:var(--paper);border:0;border-radius:99px;padding:7px 14px;font:700 12px Helvetica,Arial,sans-serif;cursor:pointer;margin:0 4px 6px 0}
.clues{font-size:14px;line-height:1.45;margin-top:8px}.clues h3{margin:10px 0 4px}.clues b{color:var(--acc);font-family:Helvetica,Arial,sans-serif}
.sd{display:grid;grid-template-columns:repeat(9,1fr);max-width:342px;margin:8px auto 14px;border:2px solid var(--ink)}
.sdc{aspect-ratio:1;min-width:0;border:1px solid var(--line);text-align:center;font:700 18px Helvetica,Arial,sans-serif;color:var(--ink);background:var(--paper);padding:0;border-radius:0;display:flex;align-items:center;justify-content:center;outline:0}
input.sdc{color:var(--acc)}.sdc.given{background:var(--soft)}
.sdc.br{border-right:2px solid var(--ink)}.sdc.bb{border-bottom:2px solid var(--ink)}
input.sdc:focus{background:var(--soft)}.sdc.ok,.cx input.ok{background:#cfe6d3;color:#1e2a33}.sdc.bad,.cx input.bad{background:#f3d1c8;color:#1e2a33}
</style>
</head>
<body>

<div class="wrap" id="shelfView"><h1>La estantería de Hugo</h1><p class="lead">Todos los números, de izquierda a derecha, del más antiguo al más reciente.</p><div id="shelf"></div></div>
<div class="reader" id="reader"><div class="bar"><button id="close">‹ Volver a la estantería</button></div>
<div class="stage"><div class="book" id="book"></div></div>
<div class="ctrl"><button id="prev" aria-label="Página anterior">‹</button><span id="count"></span><button id="next" aria-label="Página siguiente">›</button></div></div>

<!-- Una línea por revista. Para añadir una nueva, copia una línea y cambia el número. -->
<script src="numero-1.js"></script>
<script src="numero-2.js"></script>

<script>
(function(){
var book=document.getElementById('book'),reader=document.getElementById('reader'),shelf=document.getElementById('shelf'),shelfView=document.getElementById('shelfView');
var prev=document.getElementById('prev'),next=document.getElementById('next'),count=document.getElementById('count');
var issues=[],leaves=[],n=0,i=0,cur=null;
function fmt(d){try{return new Date(d+'T12:00:00').toLocaleDateString('es-ES',{month:'long',year:'numeric'});}catch(e){return d;}}
function render(){
 var w=shelfView.clientWidth-40-36,cols=Math.max(1,Math.floor((w+22)/154)),items=issues.concat([null]),h='';
 for(var r=0;r<items.length;r+=cols){h+='<div class="row">';
  items.slice(r,r+cols).forEach(function(t){
   if(!t)h+='<div class="mag empty">Próximo<br>número</div>';
   else h+='<button class="mag" data-num="'+t.num+'" style="background:'+t.color+'" aria-label="Abrir número '+t.num+'"><span class="n">Nº '+t.num+'</span><span class="t">'+t.title+'</span><span class="d">'+fmt(t.date)+'</span></button>';});
  h+='</div><div class="plank"></div>';}
 shelf.innerHTML=h;}
function upd(){leaves.forEach(function(l,k){l.classList.toggle('flipped',k<i);l.classList.toggle('far',k>i+1);});count.textContent=(i+1)+' / '+n;prev.disabled=i===0;next.disabled=i>=n-1;}
function go(d){var t=i+d;if(t<0||t>n-1)return;i=t;upd();}
function wire(el,ins){
 var bs=el.parentNode.querySelectorAll('.pz');
 function clr(t){t.classList.remove('ok','bad');}
 bs[0].onclick=function(){ins.forEach(function(t){clr(t);if(t.value)t.classList.add(t.value===t.dataset.a?'ok':'bad');});};
 bs[1].onclick=function(){ins.forEach(function(t){t.value=t.dataset.a;clr(t);t.classList.add('ok');});};
 bs[2].onclick=function(){ins.forEach(function(t){t.value='';clr(t);});};
 el.addEventListener('focusin',function(e){if(e.target.select)e.target.select();});
}
function buildSoup(el){
 var N=+el.dataset.size||10,W=JSON.parse(el.dataset.words),g=[],sol={},seed=7,L='AEIOSNRLTDCMUPB',h='',r,c,showing=false;
 for(r=0;r<N;r++){g.push([]);for(c=0;c<N;c++)g[r].push('');}
 W.forEach(function(w){for(var k=0;k<w[0].length;k++){var rr=w[1]+w[3]*k,cc=w[2]+w[4]*k;g[rr][cc]=w[0][k];sol[rr+','+cc]=1;}});
 for(r=0;r<N;r++)for(c=0;c<N;c++){if(!g[r][c]){seed=(seed*1103515245+12345)%2147483648;g[r][c]=L[seed%L.length];}h+='<button class="sc" data-k="'+r+','+c+'">'+g[r][c]+'</button>';}
 el.style.gridTemplateColumns='repeat('+N+',1fr)';el.innerHTML=h;
 el.parentNode.querySelector('.words').innerHTML=W.map(function(w){return '<span>'+w[0]+'</span>';}).join('');
 el.addEventListener('click',function(e){var b=e.target.closest('.sc');if(b)b.classList.toggle('on');});
 el.parentNode.querySelector('.pz').onclick=function(){showing=!showing;[].forEach.call(el.querySelectorAll('.sc'),function(b){b.classList.toggle('sol',showing&&!!sol[b.dataset.k]);});this.textContent=showing?'Ocultar solución':'Ver solución';};
}
function buildXW(el){
 var R=+el.dataset.rows,C=+el.dataset.cols,X=JSON.parse(el.dataset.words),g={},num={},nn=0,h='',cl={h:[],v:[]},r,c;
 X.forEach(function(x){for(var k=0;k<x[0].length;k++){g[(x[1]+(x[3]==='v'?k:0))+','+(x[2]+(x[3]==='h'?k:0))]=x[0][k];}});
 for(r=0;r<R;r++)for(c=0;c<C;c++){var key=r+','+c,rr=r,cc=c;
  if(X.some(function(x){return x[1]===rr&&x[2]===cc;}))num[key]=++nn;
  h+=g[key]?'<div class="cx">'+(num[key]?'<i>'+num[key]+'</i>':'')+'<input maxlength="1" data-a="'+g[key]+'" autocomplete="off" autocapitalize="characters"></div>':'<div class="cx"></div>';}
 el.style.gridTemplateColumns='repeat('+C+',1fr)';el.innerHTML=h;
 X.forEach(function(x){cl[x[3]].push([num[x[1]+','+x[2]],x[4]]);});
 function list(a){return a.sort(function(p,q){return p[0]-q[0];}).map(function(x){return '<div><b>'+x[0]+'.</b> '+x[1]+'</div>';}).join('');}
 el.parentNode.querySelector('.clues').innerHTML='<h3>Horizontales</h3>'+list(cl.h)+'<h3>Verticales</h3>'+list(cl.v);
 el.addEventListener('input',function(e){var t=e.target;t.value=t.value.toUpperCase().slice(-1);t.classList.remove('ok','bad');});
 wire(el,[].slice.call(el.querySelectorAll('input')));
}
function buildSudoku(el){
 var G=el.dataset.grid,S=el.dataset.solution,h='',k;
 for(k=0;k<81;k++){var r=Math.floor(k/9),c=k%9,cls='sdc'+(c%3===2&&c<8?' br':'')+(r%3===2&&r<8?' bb':'');
  h+=G[k]!=='.'?'<div class="'+cls+' given">'+G[k]+'</div>':'<input class="'+cls+'" maxlength="1" inputmode="numeric" autocomplete="off" data-a="'+S[k]+'">';}
 el.innerHTML=h;
 el.addEventListener('input',function(e){var t=e.target;t.value=t.value.replace(/[^1-9]/g,'').slice(-1);t.classList.remove('ok','bad');});
 wire(el,[].slice.call(el.querySelectorAll('input')));
}
function buildPuzzle(el){var t=el.dataset.puzzle;if(t==='soup')buildSoup(el);else if(t==='xw')buildXW(el);else if(t==='sudoku')buildSudoku(el);}
function show(t,html){
 cur=t.num;book.innerHTML=html;leaves=[].slice.call(book.querySelectorAll('.leaf'));n=leaves.length;i=0;
 leaves.forEach(function(l,k){var m=l.querySelector('.num');if(m)m.textContent=k+1;l.style.zIndex=n-k;});
 [].forEach.call(book.querySelectorAll('[data-puzzle]'),buildPuzzle);
 upd();reader.classList.add('on');shelfView.style.display='none';
 try{history.replaceState(null,'','#numero-'+t.num);}catch(e){}}
function open(num){
 var t=issues.filter(function(x){return String(x.num)===String(num);})[0];if(!t)return;
 Promise.resolve(t.html).then(function(html){show(t,html);}).catch(function(){alert('No se ha podido abrir esta revista.');});}
function close(){reader.classList.remove('on');shelfView.style.display='';cur=null;try{history.replaceState(null,'',location.pathname+location.search);}catch(e){}}
shelf.addEventListener('click',function(e){var b=e.target.closest('.mag[data-num]');if(b)open(b.dataset.num);});
document.getElementById('close').onclick=close;
prev.onclick=function(){go(-1);};next.onclick=function(){go(1);};
document.addEventListener('keydown',function(e){if(!cur)return;if(e.target&&e.target.tagName==='INPUT')return;if(e.key==='ArrowRight')go(1);if(e.key==='ArrowLeft')go(-1);if(e.key==='Escape')close();});
var sx=null;
//book.addEventListener('touchstart',function(e){if(e.target.closest&&e.target.closest('.soup,.xw,.sd'))return;sx=e.touches[0].clientX;},{passive:true});
//book.addEventListener('touchend',function(e){if(sx===null)return;var dx=e.changedTouches[0].clientX-sx;sx=null;if(dx<-50)go(1);else if(dx>50)go(-1);});
book.addEventListener('click',function(e){if(e.target.closest&&e.target.closest('input,button,summary'))return;var r=book.getBoundingClientRect(),x=(e.clientX-r.left)/r.width;if(x>.88)go(1);else if(x<.12)go(-1);});
window.addEventListener('resize',render);
Promise.resolve(window.REVISTAS||[]).then(function(list){
 issues=list.sort(function(a,b){return a.date<b.date?-1:a.date>b.date?1:0;});render();
 var m=/^#numero-(\d+)$/.exec(location.hash);if(m)open(m[1]);
}).catch(function(){shelf.innerHTML='<p class="lead">No se han podido cargar las revistas.</p>';});
})();
if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});}
</script>
</body>
</html>
